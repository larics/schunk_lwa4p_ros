# Simulation settings for using moveit_sim_controllers
moveit_sim_hw_interface:
  joint_model_group: arm
  joint_model_group_pose: set_distancer_pose
# Settings for ros_control_boilerplate control loop
generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01
# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - lwa4p_joint1
    - lwa4p_joint2
    - lwa4p_joint3
    - lwa4p_joint4
    - lwa4p_joint5
    - lwa4p_joint6
    - separator_main_left_head_joint
    - separator_main_right_head_joint
    - separator_left_back_joint
    - separator_left_front_joint
    - separator_right_back_joint
    - separator_right_front_joint
  sim_control_mode: 1  # 0: position, 1: velocity
# Publish all joint states
# Creates the /joint_states topic necessary in ROS
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
controller_list:
  - name: lwa4p/arm_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - lwa4p_joint1
      - lwa4p_joint2
      - lwa4p_joint3
      - lwa4p_joint4
      - lwa4p_joint5
      - lwa4p_joint6
  - name: lwa4p/separator_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - separator_left_back_joint
      - separator_left_front_joint
      - separator_right_back_joint
      - separator_right_front_joint
  - name: lwa4p/distancer_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - separator_main_left_head_joint
      - separator_main_right_head_joint