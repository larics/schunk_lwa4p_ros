#################################
# PID parameters for pose seeking
#################################

# Maximum value of error integral for all PID controllers
windup_limit: 0.1

# PID gains --> Increase gains even more, test it in simulation, CHECK REAL ROBOT SAFETY
# Different PID gains affect different reaching of singularity, which is quite interesting. 
# Sometimes it reaches singularity before, sometimes after. However, noetic has best preformance seen 
# until now
x_proportional_gain: 1.0  # gain 200
y_proportional_gain: 1.0    # gain: 200
z_proportional_gain: 2.5  #gain: 275 (25Hz)   # Maybe use different params than used in simulation --> TO BIG gains
x_integral_gain: 0.01
y_integral_gain: 0.01
z_integral_gain: 0.01
x_derivative_gain: 0.1
y_derivative_gain: 0.1
z_derivative_gain: 0.1

angular_proportional_gain: 1.0
angular_integral_gain: 0.0
angular_derivative_gain: 0.0
